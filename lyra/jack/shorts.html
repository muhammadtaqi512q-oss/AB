<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Shorts Generator & Downloader</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
    h2 { margin-top: 0; color: #38bdf8; text-align: center; font-size: 1.5rem; }
    .input-group { margin-bottom: 1.2rem; }
    label { display: block; margin-bottom: 0.5rem; color: #cbd5e1; font-size: 0.9rem; }
    input[type="text"] { width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 1rem; outline: none; }
    input[type="text"]:focus { border-color: #38bdf8; }
    button { width: 100%; padding: 0.75rem; border-radius: 6px; border: none; background: #0284c7; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; }
    #resultBox { margin-top: 1.5rem; display: none; }
    .badge-container { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; justify-content: center; }
    .shorts-badge { background: #ef4444; color: #fff; font-size: 0.75rem; font-weight: bold; padding: 4px 10px; border-radius: 20px; letter-spacing: 0.5px; }
    .ai-badge { background: #8b5cf6; color: #fff; font-size: 0.75rem; font-weight: bold; padding: 4px 10px; border-radius: 20px; }
    
    /* Vertical 9:16 Shorts Player Frame */
    .shorts-container { width: 100%; max-width: 315px; height: 560px; background: #000; border-radius: 12px; overflow: hidden; margin: 0 auto 1rem auto; border: 1px solid #334155; }
    iframe { width: 100%; height: 100%; border: none; }
    
    .title-text { font-size: 0.9rem; font-weight: 600; color: #e2e8f0; margin-bottom: 8px; text-align: center; line-height: 1.4; }
    .btn-download { display: block; width: 100%; text-align: center; padding: 0.8rem; background: #16a34a; color: white; font-weight: bold; border-radius: 6px; text-decoration: none; font-size: 1rem; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3); }
    .btn-download:hover { background: #15803d; }
    .status { text-align: center; color: #38bdf8; margin: 10px 0; font-size: 0.9rem; }
  </style>
</head>
<body>

<div class="card">
  <h2>AI Shorts Generator</h2>

  <div class="input-group">
    <label for="promptInput">Enter AI Shorts Prompt:</label>
    <input type="text" id="promptInput" value="banana dance" placeholder="e.g. banana dance">
  </div>

  <button id="genBtn" onclick="searchAIShorts()">Generate AI Shorts</button>

  <div id="status" class="status"></div>

  <div id="resultBox">
    <div class="badge-container">
      <span class="shorts-badge">⚡ YOUTUBE SHORTS</span>
      <span class="ai-badge">✨ AI GENERATED</span>
    </div>
    <div class="title-text" id="videoTitle"></div>
    <div class="shorts-container">
      <iframe id="shortsPlayer" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
    <a id="downloadBtn" href="#" target="_blank" class="btn-download">Download Shorts via SSYouTube</a>
  </div>
</div>

<script>
  async function searchAIShorts() {
    const userPrompt = document.getElementById('promptInput').value.trim();
    if (!userPrompt) return alert('Karam karke prompt enter karein!');

    // Force search strictly for Shorts & AI tags
    const shortsQuery = `${userPrompt} #shorts AI generated video`;

    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');
    const btn = document.getElementById('genBtn');
    const player = document.getElementById('shortsPlayer');
    const downloadBtn = document.getElementById('downloadBtn');
    const videoTitle = document.getElementById('videoTitle');

    btn.disabled = true;
    status.innerText = 'Searching AI Shorts... Please wait';
    resultBox.style.display = 'none';

    try {
      const endpoints = [
        'https://pipedapi.kavin.rocks',
        'https://api.piped.private.coffee',
        'https://pipedapi.mha.fi'
      ];

      let videoData = null;

      for (let api of endpoints) {
        try {
          const res = await fetch(`${api}/search?q=${encodeURIComponent(shortsQuery)}&filter=all`);
          if (res.ok) {
            const data = await res.json();
            if (data.items && data.items.length > 0) {
              // Priority 1: Check items that have #shorts or duration <= 60 seconds
              videoData = data.items.find(item => {
                if (item.type !== 'stream') return false;
                const isShortDuration = item.duration && item.duration <= 60;
                const isShortsTitle = item.title.toLowerCase().includes('#shorts') || item.title.toLowerCase().includes('shorts');
                return isShortDuration || isShortsTitle;
              });

              if (!videoData) {
                videoData = data.items.find(item => item.type === 'stream');
              }

              if (videoData) break;
            }
          }
        } catch (e) {
          console.log(`Endpoint ${api} search failed...`);
        }
      }

      if (videoData) {
        const videoId = videoData.url.split('v=')[1];
        videoTitle.innerText = videoData.title;
        
        // YouTube Shorts Embed URL Format
        player.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1`;
        
        // SSYouTube Direct Link for Shorts Format (/shorts/ or /watch?v=)
        downloadBtn.href = `https://www.ssyoutube.com/shorts/${videoId}`;
        
        status.innerText = '';
        resultBox.style.display = 'block';
      } else {
        const encoded = encodeURIComponent(`${userPrompt} #shorts AI`);
        videoTitle.innerText = `AI Shorts Result for: "${userPrompt}"`;
        player.src = `https://www.youtube-nocookie.com/embed?listType=search&list=${encoded}`;
        downloadBtn.href = `https://ssyoutube.com/results?search_query=${encoded}`;
        status.innerText = '';
        resultBox.style.display = 'block';
      }
    } catch (err) {
      status.innerText = 'Error loading Shorts. Try again.';
    } finally {
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
